services:
  - type: web
    name: proposed-nigerian-coast-guard-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: FRONTEND_URL
        value: https://proposed-nigerian-coast-guard.vercel.app
      - key: SERVER_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: proposed-nigerian-coast-guard-preview-db
          property: connectionString
      - key: ENGAGEMENT_ENABLED
        value: 'false'
      - key: NEWSLETTER_ENABLED
        value: 'false'
      - key: CONSULTATION_AUTHORIZED
        value: 'false'
      - key: RECRUITMENT_AUTHORIZED
        value: 'false'
